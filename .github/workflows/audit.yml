name: Validate manifest

# GoReleaser pushes directly to main (no PR) on every veirox-cli release
# tag, so this runs post-hoc on every push rather than gating a merge —
# its job is to catch a broken manifest fast, not to block the push.
#
# Deliberately GitHub-hosted, not the workspace's usual self-hosted
# droplet runner (see ../../../veirox-infra/CLAUDE.md):
# there is no self-hosted Windows runner, and Scoop only exists on
# Windows. GitHub Actions is free and unlimited on public repos
# regardless of runner OS, so this costs nothing either way —
# windows-latest is simply the only option that can do the job.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON syntax + required-fields check
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw veirox.json | ConvertFrom-Json
          foreach ($field in @("version", "homepage", "license", "description", "architecture")) {
            if (-not $manifest.PSObject.Properties.Name.Contains($field)) {
              throw "manifest missing required field: $field"
            }
          }
          Write-Host "manifest OK, version $($manifest.version)"

      # windows-latest has no preinstalled Scoop.
      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod get.scoop.sh | Invoke-Expression
          echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # `scoop bucket add` wants a real git URL, not a bare local path —
      # installing directly from the manifest file is the simpler,
      # equally-real proof (same manifest-parsing/download/install code
      # path `scoop install veirox` takes once the bucket is added).
      - name: Install + smoke test (the real end-to-end proof)
        shell: pwsh
        run: |
          scoop install "$(Resolve-Path veirox.json)"
          veirox version --short
